name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend · dataset, training, MLflow, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install pinned backend dependencies
        run: python -m pip install --upgrade pip && pip install -e "backend[dev]"

      - name: Regenerate deterministic benchmark dataset
        run: python backend/scripts/generate_dataset.py

      - name: Train, evaluate and export the model (real MLflow runs)
        run: python backend/scripts/train_model.py

      - name: Backend test suite (validation, FAISS retrieval, leakage, training, API, export)
        working-directory: backend
        run: python -m pytest tests/ -q --ignore=tests/test_api_postgres.py

  postgres:
    name: Backend · PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendorlens
          POSTGRES_PASSWORD: vendorlens
          POSTGRES_DB: vendorlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendorlens -d vendorlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install pinned backend dependencies
        run: python -m pip install --upgrade pip && pip install -e "backend[dev]"

      - name: PostgreSQL-backed API integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vendorlens:vendorlens@localhost:5432/vendorlens_test
        run: python -m pytest tests/test_api_postgres.py -q

  frontend:
    name: Frontend · typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check and production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E · Playwright browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -e "backend[dev]"

      - name: Install frontend + e2e dependencies
        run: |
          cd frontend && npm ci
          cd ../tests/e2e && npm ci

      - name: Install Playwright browser (chromium) with system dependencies
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run end-to-end suite (backend + preview frontend + browser)
        env:
          PYTHON: python
        run: bash scripts/e2e-run.sh

      - name: Upload captured screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: assets/screenshots/
          if-no-files-found: warn

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: tests/e2e/test-results/
          if-no-files-found: ignore

  docker:
    name: Docker · image builds + compose health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t vendorlens-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t vendorlens-frontend:ci .

      - name: Compose stack health smoke (PostgreSQL + API + web)
        run: |
          docker compose up -d --build --wait
          curl -sf http://localhost:8000/api/v1/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8000/api/v1/health | grep -q '"database":"ok"'
          curl -sf http://localhost:8000/api/v1/model/metrics | grep -q '"model_version"'
          curl -sf -X POST http://localhost:8000/api/v1/analyses/demo | grep -q '"counts"'
          curl -sf http://localhost:8080/ | grep -q 'VendorLens AI'
          echo "Compose stack healthy"

      - name: Tear down
        if: always()
        run: docker compose down -v
