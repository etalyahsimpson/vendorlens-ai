# VendorLens AI - full local stack: PostgreSQL + FastAPI backend + React frontend.
#
#   docker compose up --build
#
# Frontend:  http://localhost:8080
# Backend:   http://localhost:8000  (API docs at /docs)
# Database:  PostgreSQL 16 (localhost:5432, user/pass/db: vendorlens)
#
# The trained model bundle, sample dataset and evaluation reports are baked
# into the backend image from the committed repository files - no external
# services, API keys or downloads are required.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendorlens
      POSTGRES_PASSWORD: vendorlens
      POSTGRES_DB: vendorlens
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendorlens -d vendorlens"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vendorlens_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://vendorlens:vendorlens@db:5432/vendorlens
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vendorlens_pgdata:
