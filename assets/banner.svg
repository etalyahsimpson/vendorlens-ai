<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="VendorLens AI - Intelligent Supplier Identity Resolution and Duplicate Detection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1626"/>
      <stop offset="0.55" stop-color="#10233C"/>
      <stop offset="1" stop-color="#16304F"/>
    </linearGradient>
    <linearGradient id="tealfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#glow)"/>

  <!-- Faint grid of records -->
  <g opacity="0.14" stroke="#8FB0D3" stroke-width="1">
    <line x1="640" y1="60" x2="640" y2="340"/>
    <line x1="760" y1="60" x2="760" y2="340"/>
    <line x1="880" y1="60" x2="880" y2="340"/>
    <line x1="1000" y1="60" x2="1000" y2="340"/>
    <line x1="1120" y1="60" x2="1120" y2="340"/>
    <line x1="620" y1="110" x2="1160" y2="110"/>
    <line x1="620" y1="200" x2="1160" y2="200"/>
    <line x1="620" y1="290" x2="1160" y2="290"/>
  </g>

  <!-- Left: brand lockup -->
  <g transform="translate(72,86)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#0D9488" opacity="0.16"/>
    <rect x="8" y="8" width="60" height="60" rx="14" fill="none" stroke="#2DD4BF" stroke-width="1.4" opacity="0.5"/>
    <!-- Lens mark -->
    <circle cx="38" cy="36" r="17" fill="none" stroke="#2DD4BF" stroke-width="5"/>
    <line x1="51" y1="49" x2="64" y2="62" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32.5" cy="41" r="3.4" fill="#F59E0B"/>
    <circle cx="43" cy="33" r="3.4" fill="#2DD4BF"/>
    <circle cx="44" cy="43.5" r="3.4" fill="#F8FAFC"/>
  </g>

  <text x="176" y="122" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
    VendorLens <tspan fill="#2DD4BF">AI</tspan>
  </text>
  <text x="176" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#8FB0D3">
    Intelligent Supplier Identity Resolution
  </text>
  <text x="176" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#8FB0D3">
    &amp; Duplicate Detection
  </text>

  <text x="76" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#B9CFE5">
    <tspan x="76" dy="0">Find duplicate supplier records, compare the evidence, and route</tspan>
    <tspan x="76" dy="27">uncertain matches for human review before bad data spreads.</tspan>
  </text>

  <!-- Tech chips -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600">
    <rect x="76" y="300" width="86" height="30" rx="15" fill="#0D9488" opacity="0.22"/>
    <text x="119" y="320" text-anchor="middle" fill="#5EEAD4">FastAPI</text>
    <rect x="172" y="300" width="112" height="30" rx="15" fill="#0D9488" opacity="0.22"/>
    <text x="228" y="320" text-anchor="middle" fill="#5EEAD4">scikit-learn</text>
    <rect x="294" y="300" width="74" height="30" rx="15" fill="#0D9488" opacity="0.22"/>
    <text x="331" y="320" text-anchor="middle" fill="#5EEAD4">FAISS</text>
    <rect x="378" y="300" width="82" height="30" rx="15" fill="#0D9488" opacity="0.22"/>
    <text x="419" y="320" text-anchor="middle" fill="#5EEAD4">MLflow</text>
    <rect x="470" y="300" width="82" height="30" rx="15" fill="#0D9488" opacity="0.22"/>
    <text x="511" y="320" text-anchor="middle" fill="#5EEAD4">React</text>
  </g>

  <!-- Right: two records resolving into one entity through a lens -->
  <g transform="translate(668,84)">
    <!-- Record card A -->
    <g>
      <rect x="0" y="8" width="190" height="86" rx="10" fill="#F8FAFC" opacity="0.97"/>
      <rect x="0" y="8" width="190" height="20" rx="10" fill="#2DD4BF" opacity="0.16"/>
      <text x="14" y="42" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#10233C">SUP-0107</text>
      <text x="14" y="60" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#1F2937">Northstar Industrial</text>
      <text x="14" y="76" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#1F2937">Supplies LLC</text>
      <circle cx="176" cy="22" r="5" fill="#0D9488"/>
    </g>
    <!-- Record card B -->
    <g transform="translate(0,120)">
      <rect x="0" y="0" width="190" height="86" rx="10" fill="#F8FAFC" opacity="0.97"/>
      <rect x="0" y="0" width="190" height="20" rx="10" fill="#F59E0B" opacity="0.2"/>
      <text x="14" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#10233C">SUP-0320</text>
      <text x="14" y="52" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#1F2937">North Star Industrial</text>
      <text x="14" y="68" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#1F2937">Supply</text>
      <circle cx="176" cy="14" r="5" fill="#D97706"/>
    </g>

    <!-- Connector lines into the lens -->
    <path d="M190 51 C 250 51, 262 96, 300 105" fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.85"/>
    <path d="M190 163 C 250 163, 262 118, 300 109" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.85"/>

    <!-- Lens verdict -->
    <g transform="translate(300,62)">
      <circle cx="52" cy="52" r="50" fill="#0A1626" stroke="#2DD4BF" stroke-width="3"/>
      <circle cx="52" cy="52" r="40" fill="none" stroke="#2DD4BF" stroke-width="1" opacity="0.35"/>
      <!-- check -->
      <path d="M36 54 L48 66 L70 40" fill="none" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="126" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5EEAD4">94% match</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="392" width="1200" height="8" rx="4" fill="url(#tealfade)"/>
</svg>
